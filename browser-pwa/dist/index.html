<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#6757e8">
  <meta name="color-scheme" content="light dark">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Rozvrh+">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="description" content="Český školní organizér pro rozvrh, úkoly, zkoušky, kalendář, materiály a poznámky.">
  <title>Rozvrh+</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <link rel="stylesheet" href="/app.css">
</head>
<body>
  <noscript>Pro používání aplikace Rozvrh+ zapni JavaScript.</noscript>
  <main id="auth-root" class="auth-root" aria-live="polite">
    <div class="auth-loading"><span class="loader"></span><p>Ověřuji přihlášení…</p></div>
  </main>
  <div id="app" hidden>
    <aside class="sidebar" aria-label="Hlavní navigace">
      <a class="brand" href="#domu" aria-label="Rozvrh+ – domů">
        <img class="brand-logo-image" src="/icons/apple-touch-icon.png" alt="" aria-hidden="true">
        <span><strong>Rozvrh<span>+</span></strong><small>školní organizér</small></span>
      </a>
      <nav id="desktop-nav" class="side-nav"></nav>
      <div class="sidebar-card">
        <span class="sidebar-card-icon" aria-hidden="true">☁</span>
        <strong>Funguje i offline</strong>
        <p>Data zůstávají bezpečně v tomto zařízení.</p>
      </div>
      <button class="profile-chip" data-action="navigate" data-view="nastaveni">
        <span class="avatar" id="side-avatar">P</span>
        <span><strong id="side-name">Student</strong><small>Nastavení účtu</small></span>
        <span aria-hidden="true">›</span>
      </button>
    </aside>

    <div class="shell">
      <header class="topbar">
        <a class="mobile-brand" href="#domu" aria-label="Rozvrh+ – domů">
          <img class="brand-logo-image" src="/icons/apple-touch-icon.png" alt="" aria-hidden="true">
          <strong>Rozvrh<span>+</span></strong>
        </a>
        <div class="page-heading">
          <small id="page-kicker">PŘEHLED</small>
          <h1 id="page-title">Domů</h1>
        </div>
        <div class="top-actions">
          <button class="icon-button install-shortcut" data-action="show-install" aria-label="Nainstalovat aplikaci" title="Nainstalovat aplikaci">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12m0 0 4-4m-4 4-4-4M5 15v4h14v-4"/></svg>
          </button>
          <button class="avatar-button" data-action="navigate" data-view="nastaveni" aria-label="Otevřít nastavení">
            <span id="top-avatar">P</span>
          </button>
        </div>
      </header>

      <main id="main-content" tabindex="-1">
        <div class="loading-card" aria-live="polite">
          <span class="loader"></span>
          <p>Připravuji Rozvrh+…</p>
        </div>
      </main>
    </div>

    <nav id="mobile-nav" class="mobile-nav" aria-label="Hlavní navigace"></nav>
  </div>

  <div id="install-nudge" class="install-nudge" hidden>
    <div class="install-app-icon"><img src="/icons/apple-touch-icon.png" alt="" aria-hidden="true"></div>
    <div>
      <strong>Měj Rozvrh+ vždy po ruce</strong>
      <p id="install-nudge-text">Přidej si aplikaci na plochu.</p>
    </div>
    <button class="nudge-primary" data-action="show-install">Ukázat návod</button>
    <button class="nudge-close" data-action="dismiss-install" aria-label="Skrýt">×</button>
  </div>

  <div id="modal-root"></div>
  <div id="toast-root" class="toast-root" aria-live="polite" aria-atomic="true"></div>
  <input id="material-input" type="file" multiple hidden>
  <input id="import-input" type="file" accept="application/json" hidden>
  <script src="/app.js" defer></script>
</body>
</html>
